<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Infinite Tile World Demo</title>
<style>
:root{--bg:#f4f1ea;--fg:#23201a;--bar:#e6e1d3;--line:#c9c2ae;--accent:#2f7d4f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#e8e6df;--bar:#22252a;--line:#3a3f46;--accent:#5fc88a}}
:root[data-theme="dark"]{--bg:#15171a;--fg:#e8e6df;--bar:#22252a;--line:#3a3f46;--accent:#5fc88a}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
header label{display:flex;align-items:center;gap:6px}
input[type=number]{width:110px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
#wrap{position:relative;flex:1;min-height:0}
canvas{cursor:crosshair;position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:absolute;left:8px;top:8px;padding:6px 9px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;pointer-events:none;white-space:pre}
#help{position:absolute;left:8px;bottom:8px;padding:5px 9px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;pointer-events:none}
#prompt{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);padding:4px 10px;border-radius:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;pointer-events:none;display:none}
#msg{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:90%;padding:8px 14px;border-radius:10px;background:rgba(0,0,0,.75);color:#fff;text-align:center;pointer-events:none;display:none}
#act{position:absolute;right:92px;bottom:14px;width:52px;height:52px;border-radius:50%;font-weight:700;font-size:16px}
#atk{touch-action:none;position:absolute;right:14px;bottom:24px;width:68px;height:68px;border-radius:50%;font-weight:700;background:#c0392b}
#bag-btn{position:absolute;right:22px;bottom:104px;width:52px;height:52px;border-radius:50%;font-weight:700;background:#555}
#bag{position:absolute;right:8px;top:56px;min-width:170px;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.78);color:#fff;font-size:13px;line-height:1.7;display:none}
#bag button{padding:1px 6px;font-size:11px}
#shop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,92%);padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.9);color:#fff;font-size:13px;line-height:1.7;display:none;z-index:6;max-height:80%;overflow:auto}
#shop button{padding:3px 9px;font-size:12px}#shop hr{border:0;border-top:1px solid #555}
#msg{z-index:7}
#menu-btn{position:absolute;right:8px;top:8px;width:40px;height:40px;z-index:3;border-radius:50%;background:#555;font-size:18px}
button{touch-action:manipulation}
body{position:relative;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
@supports(height:100dvh){html,body{height:100dvh}}
@media (max-width:700px){header{position:absolute;top:0;left:0;right:0;z-index:5;display:none}body.menu header{display:flex}#menu-btn{display:block}#hud{font-size:10.5px;padding:4px 7px}#bag{top:auto;bottom:170px;right:12px;max-height:40%;overflow:auto}#msg{top:100px;font-size:13px}}
@media (pointer:coarse){#help{display:none}#prompt{bottom:110px}}
header{display:none!important}
#ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,12,16,.85);padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px))}
.card{background:var(--bar);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(440px,100%);max-height:100%;overflow:auto}
.card h1{margin:0 0 4px;font-size:22px}.card h2{margin:0 0 10px}
.card button{padding:8px 12px}
.slot{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin:8px 0}
.del{background:#b03a2e}
#pause button{display:block;width:100%;margin:6px 0}
#nseed{width:120px;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
</style>
</head>
<body>
<header>
<label>Seed <input id="seed" type="number" value="1337"></label>
<button id="rnd">Random seed</button>

</header>
<div id="wrap"><canvas id="c"></canvas><div id="hud"></div><div id="help">WASD move. Click or hold the mouse to attack toward the cursor. Space attacks the way you face. E interact, I bag, H eat. Towns are safe.</div><div id="prompt">E: interact</div><div id="msg"></div><div id="bag"></div><div id="shop"></div><button id="menu-btn">☰</button><button id="bag-btn">Bag</button><button id="atk">Hit</button><button id="act">E</button></div>
<div id="ov"><div class="card" id="title"><h1>Infinite Tile World</h1><small>Explore, fight, loot and trade. Pick a save slot.</small><div id="slots"></div><label>New game seed <input id="nseed" type="number" placeholder="random"></label></div><div class="card" id="pause" style="display:none"><h2>Paused</h2><button id="p-resume">Resume</button><button id="p-save">Save game</button><button id="p-quit">Save &amp; quit to menu</button><label><input id="grid" type="checkbox"> Show chunk borders</label><div><label>Volume <input id="vol" type="range" min="0" max="100" style="width:140px;vertical-align:middle"></label></div><div><label><input id="mute" type="checkbox"> Mute sound</label></div><div><small id="p-info"></small></div></div></div>
<script>
const CH=16, TS=24, R=2;
const COL=['#1d4e89','#3b82c4','#e3d08a','#5fa55a','#5fa55a','#8a8f55','#8d8d92','#5fa55a','#b99b6b','#8a6a3c','#a8a398','#b5523b','#d9c7a0','#f2f5f7','#3f8a4a','#d9c7a0','#c9a36b','#d8d8e0','#c9a36b','#c9a36b','#c9a36b','#c9a36b','#c9a36b','#c9a36b','#c9a36b','#c9a36b','#d9c7a0'];
// 0 deep,1 water,2 sand,3 grass,4 tree,5 hill,6 mountain,7 chest,8 road,9 bridge,10 cobble,11 roof,12 door,13 snow,14 forest floor,15 wall
const SOLID=new Set([0,4,6,11,13,15,18,19,20,21,22,23,24,25,26]);
let seed=1337;
function hash(x,y,s){let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967295}
function vnoise(x,y,s){const x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0;
const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
const a=hash(x0,y0,s),b=hash(x0+1,y0,s),c=hash(x0,y0+1,s),d=hash(x0+1,y0+1,s);
return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s,o){let sum=0,amp=1,f=1,n=0;for(let i=0;i<o;i++){sum+=amp*vnoise(x*f,y*f,s+i*101);n+=amp;amp*=.5;f*=2}return sum/n}
// Towns: one possible town per 64x64 region. Roads link each town to its right and lower neighbours.
const tcache=new Map();
function townOf(rx,ry){const k=seed+':'+rx+','+ry;let t=tcache.get(k);if(t!==undefined)return t;
t=hash(rx,ry,seed+50)<.7?{x:rx*64+15+Math.floor(hash(rx,ry,seed+51)*35),y:ry*64+15+Math.floor(hash(rx,ry,seed+52)*35)}:null;if(t)makeTown(t);tcache.set(k,t);return t}
function roadAt(x,y){const rx=Math.floor(x/64),ry=Math.floor(y/64);
for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const a=townOf(rx+i,ry+j);if(!a)continue;
for(const b of [townOf(rx+i+1,ry+j),townOf(rx+i,ry+j+1)]){if(!b)continue;
const x0=Math.min(a.x,b.x),x1=Math.max(a.x,b.x),y0=Math.min(a.y,b.y),y1=Math.max(a.y,b.y);
if(y>=a.y&&y<=a.y+1&&x>=x0&&x<=x1+1)return true;
if(x>=b.x&&x<=b.x+1&&y>=y0&&y<=y1+1)return true}}return false}
// Towns: 29x18 street grid. Buildings are 7x6 (mall 25x6): wall ring, a door in the front wall, interior from a template.
const KN={house:'House',school:'School',office:'Office',grocery:'Grocery',cafe:'Café',bookshop:'Bookshop',smith:'Blacksmith',mall:'Mall'};
const ROOF={house:'#b5523b',school:'#d4a53a',office:'#5b6f8a',grocery:'#3f9d6a',cafe:'#8e5a3c',bookshop:'#7a4aa0',smith:'#6b6f76',mall:'#c24d8a'};
const TFLOOR=new Set(['school','office','grocery','smith','mall']);
const CM={B:18,T:19,S:20,C:21,D:22,K:23,P:24,O:25,W:26};
const TPL={house:['BB.KS','...T.','O..T.','O...P'],school:['WWWWW','DD.DD','DD.DD','....P'],office:['DD.DD','DD.DD','S...P','.....'],grocery:['SSSSS','S...S','S...S','CC...'],cafe:['CCCCK','....P','T.T.T','.....'],bookshop:['SSSSS','S.S.S','S.S.S','C....'],smith:['KKCKK','.....','.T.T.','.....']};
TPL.mall=['SSSS.CCC.SSSS.CCC.SSSS.',Array.from({length:23},(_,i)=>i%8===0?'P':'.').join(''),'.'.repeat(23),'.'.repeat(23)];
function makeTown(t){t.ox=t.x-14;t.oy=t.y-7;t.b=[];
const ks=['school','office','grocery','cafe','bookshop','house','smith'].map((k,i)=>[hash(i,t.x*3+t.y,seed+70),k]).sort((a,b)=>a[0]-b[0]).map(a=>a[1]);ks.splice(ks.indexOf('smith'),1);ks.splice(Math.floor(hash(t.x,t.y,seed+72)*3),0,'smith');
const add=(k,i,j,w)=>t.b.push({kind:k,name:KN[k],roof:ROOF[k],x0:t.ox+2+i*9,y0:t.oy+1+j*8,w:w,h:6,a:1,doors:w>7?[6,12,18]:[3]});
if(hash(t.x,t.y,seed+71)<.4){add('mall',0,0,25);for(let i=0;i<3;i++)add(ks[i],i,1,7)}else for(let n=0;n<6;n++)add(ks[n],n%3,Math.floor(n/3),7)}
function bAt(x,y){const t=townOf(Math.floor(x/64),Math.floor(y/64));if(!t)return null;
for(const b of t.b)if(x>=b.x0&&x<b.x0+b.w&&y>=b.y0&&y<b.y0+b.h)return b;return null}
function bTile(b,cx,cy){if(cy===b.h-1&&b.doors.includes(cx))return 12;
if(cx===0||cy===0||cx===b.w-1||cy===b.h-1)return 15;
const c=TPL[b.kind][cy-1][cx-1];return c==='.'?(TFLOOR.has(b.kind)?17:16):CM[c]}
function townTile(x,y){const t=townOf(Math.floor(x/64),Math.floor(y/64));if(!t)return -1;
const lx=x-t.ox,ly=y-t.oy;if(lx<0||ly<0||lx>28||ly>17)return -1;
const b=bAt(x,y);return b?bTile(b,x-b.x0,y-b.y0):10}
function drawBld(g,t,X,Y){const r=(c,a,b,w,h)=>{g.fillStyle=c;g.fillRect(X+a,Y+b,w,h)};
if(t===15){r('rgba(0,0,0,.22)',0,0,TS,2);r('rgba(0,0,0,.22)',0,TS-2,TS,2)}
else if(t===16)r('rgba(0,0,0,.08)',0,TS/2,TS,1);
else if(t===17){r('rgba(0,0,0,.05)',0,0,TS/2,TS/2);r('rgba(0,0,0,.05)',TS/2,TS/2,TS/2,TS/2)}
else if(t===18){r('#4a6fa5',2,3,TS-4,TS-5);r('#fff',4,4,TS-8,6)}
else if(t===19)r('#8b5a2b',3,3,TS-6,TS-6);
else if(t===20){r('#5a3a1e',1,2,TS-2,TS-4);r('#d94f4f',4,5,4,5);r('#4fa3d9',10,5,4,5);r('#e3c34f',16,5,4,5);r('#4fd98a',4,13,4,5);r('#d94fa3',12,13,5,5)}
else if(t===21){r('#7a5230',0,4,TS,TS-8);r('#d9b88a',0,4,TS,4)}
else if(t===22){r('#a77c4a',2,6,TS-4,TS-10);r('#222',7,2,10,6)}
else if(t===23){r('#666',2,2,TS-4,TS-4);r('#222',6,6,4,4);r('#222',14,6,4,4)}
else if(t===24){r('#b5523b',8,14,8,7);g.fillStyle='#2f8a3e';g.beginPath();g.arc(X+TS/2,Y+10,7,0,7);g.fill()}
else if(t===25){r('#8a4a6a',1,4,TS-2,TS-8);r('#a86088',1,4,TS-2,5)}
else if(t===26){r('#2f5a3e',1,3,TS-2,TS-8);r('#eee',4,8,10,1)}}
const MSG={18:{_:'You rest on the bed for a moment. Cozy.'},
19:{cafe:'A table with a half-finished coffee and a croissant.',_:'A table set with two bowls of soup.'},
20:{grocery:'Shelves of apples, bread and jars of honey. You grab an apple.',bookshop:'Rows of old paperbacks. One title: “Maps of Nowhere”.',mall:'Racks of bags, shoes and gadgets. Everything is on sale!',_:'A shelf of dusty trinkets and a framed photo.'},
21:{grocery:'The grocer nods. “Fresh bread today!”',cafe:'“One coffee?” the barista smiles.',bookshop:'The clerk is reading and doesn’t look up.',mall:'Cashier: “Welcome to the mall!”',_:'A counter.'},
22:{school:'A desk covered in doodles and a half-done math problem.',_:'A monitor shows a spreadsheet that never ends.'},
23:{smith:'The forge roars. Heat washes over you.',cafe:'The espresso machine hisses happily.',_:'Something is simmering on the stove.'},
24:{_:'A well-watered plant.'},25:{_:'You sit for a moment. Comfy.'},26:{_:'The chalkboard reads: 2 + 2 = ? (It’s 4.)'}};
function nearby(){const px=Math.floor(P.x),py=Math.floor(P.y);if(townTile(px,py)<0)return null;
let best=null,bd=1.6;for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++){const x=px+i,y=py+j,t=tileAt(x,y);if(!MSG[t])continue;
const d=Math.hypot(x+.5-P.x,y+.5-P.y);if(d<bd){bd=d;best={x:x,y:y,t:t}}}return best}
let msgT;
function interact(){if(paused)return;const n=nearby();if(!n)return;const b=bAt(n.x,n.y),m=MSG[n.t];const sa=shopAct(n.t,b&&b.kind);if(sa){sfx(/Sold/.test(sa)?'coin':'interact');say(sa);return}
sfx('interact');msgEl.textContent=(b&&m[b.kind])||m._;msgEl.style.display='block';clearTimeout(msgT);msgT=setTimeout(()=>msgEl.style.display='none',3500)}
document.getElementById('act').onclick=interact;
// Enemies: slimes (plains) and wolves (forest/mountains). They wander, chase when they see you, and can't enter towns.
const enemies=[];let spT=0;
// Inventory, loot drops, shops. Saved in localStorage when available.
const ITEMS={coins:['Coins',0],gel:['Slime gel',2],pelt:['Wolf pelt',5],fang:['Wolf fang',12],apple:['Apple',0]};
const DC={coins:'#f2c230',gel:'#7be88a',pelt:'#8a5a34',fang:'#f4f4f0',apple:'#d7263d'};
let inv={coins:0,gel:0,pelt:0,fang:0,apple:0,kills:0,sword:0,armor:0};

const drops=[];
function save(){if(!slot)return;try{localStorage.setItem('iw_slot'+slot,JSON.stringify({seed:seed,x:P.x,y:P.y,hp:P.hp,inv:inv,t:playT,at:Date.now()}))}catch(e){}}
function renderBag(){const bagEl=document.getElementById('bag');
let h='<b>Bag</b><span id="bx" style="float:right;cursor:pointer">\u2715</span><br>Coins: '+inv.coins+'<br>',any=false;
for(const k of ['apple','gel','pelt','fang'])if(inv[k]>0){any=true;h+=ITEMS[k][0]+' x'+inv[k]+(k==='apple'?' <button data-use="apple">Eat</button>':' <small>('+ITEMS[k][1]+'c each)</small>')+'<br>'}
if(!any)h+='<small>Empty. Defeat monsters to find loot.</small>';
bagEl.innerHTML=h}
function toggleBag(){const b=document.getElementById('bag');b.style.display=b.style.display==='block'?'none':'block'}
function addItem(it,n,quiet){inv[it]+=n;sfx(it==='coins'?'coin':'pick');save();renderBag();if(!quiet)say('+'+n+' '+ITEMS[it][0])}
function eatApple(){if(inv.apple<1){say('You have no apples.');return}if(P.hp>=maxHp()){say('Already at full health.');return}
inv.apple--;sfx('eat');P.hp=Math.min(maxHp(),P.hp+3);save();renderBag();say('You eat an apple. +3 HP')}
function dropLoot(e){const w=e.k==='wolf',add=(it,n)=>drops.push({x:e.x+(Math.random()-.5)*.8,y:e.y+(Math.random()-.5)*.8,it:it,n:n||1,t:30});
if(Math.random()<(w?.6:.7))add(w?'pelt':'gel');
if(w&&Math.random()<.1+.05*(e.tier||0))add('fang');
if(Math.random()<.55)add('coins',Math.ceil((1+Math.floor(Math.random()*(w?3:2)))*(1+.5*(e.tier||0))));
if(Math.random()<.1)add('apple')}
function updateDrops(dt){for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.t-=dt;
if(d.t<=0){drops.splice(i,1);continue}
if(Math.hypot(d.x-P.x,d.y-P.y)<.9){drops.splice(i,1);addItem(d.it,d.n)}}}
function drawDrops(camX,camY){const now=performance.now()/1000;for(const d of drops){if(d.t<5&&Math.floor(d.t*6)%2)continue;
const sx=d.x*TS-camX,sy=d.y*TS-camY+Math.sin(now*4+d.x*3)*2;if(sx<-20||sy<-20||sx>W+20||sy>H+20)continue;
ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1.5;ctx.fillStyle=DC[d.it];ctx.beginPath();
if(d.it==='fang'){ctx.moveTo(sx-4,sy-5);ctx.lineTo(sx+4,sy-5);ctx.lineTo(sx,sy+5);ctx.closePath()}
else if(d.it==='pelt')ctx.rect(sx-6,sy-4,12,8);else ctx.arc(sx,sy,d.it==='coins'?4:5,0,7);
ctx.fill();ctx.stroke()}}
function shopAct(t,kind){
if(t===21&&kind==='smith'){openShop();return 'The smith looks up. \u201cWhat do you need?\u201d'}
if(t===20&&kind==='grocery'){if(inv.coins>=3){inv.coins-=3;addItem('apple',1,true);return 'You buy an apple for 3 coins.'}return 'An apple costs 3 coins. You have '+inv.coins+'.'}
if(t===21&&kind&&kind!=='house'&&kind!=='school'&&kind!=='office'){let tot=0;for(const k of ['gel','pelt','fang']){tot+=inv[k]*ITEMS[k][1];inv[k]=0}
if(tot>0){inv.coins+=tot;save();renderBag();return 'Sold your loot for '+tot+' coins.'}
return (MSG[21][kind]||MSG[21]._)+' (Bring monster loot here to sell.)'}
return null}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();if(k==='i')toggleBag();if(k==='h')eatApple()});
document.getElementById('bag-btn').onclick=toggleBag;
document.getElementById('bag').addEventListener('click',e=>{if(e.target.dataset.use)eatApple();if(e.target.id==='bx')toggleBag()});
renderBag();
// Menu and save slots (3 slots in localStorage; autosaves every 10s and on loot/kills).
let paused=true,slot=0,playT=0,autoT=0,canSave=true;
try{localStorage.setItem('iw_t','1');localStorage.removeItem('iw_t')}catch(e){canSave=false}
function readSlot(n){try{return JSON.parse(localStorage.getItem('iw_slot'+n)||'null')}catch(e){return null}}
function fmtT(s){s=Math.floor(s||0);return Math.floor(s/3600)+'h '+Math.floor(s/60)%60+'m'}
function renderSlots(){let h='';for(let n=1;n<=3;n++){const d=readSlot(n);
h+='<div class="slot"><div style="flex:1"><b>Slot '+n+'</b><br><small>'+(d?('Seed '+d.seed+' \u00b7 '+((d.inv&&d.inv.kills)||0)+' kills \u00b7 '+((d.inv&&d.inv.coins)||0)+' coins \u00b7 '+fmtT(d.t)+'<br>'+new Date(d.at).toLocaleString()):'Empty')+'</small></div>'
+(d?'<button data-a="load" data-n="'+n+'">Continue</button><button class="del" data-a="del" data-n="'+n+'">Delete</button>':'<button data-a="new" data-n="'+n+'">New game</button>')+'</div>'}
document.getElementById('slots').innerHTML=h+(canSave?'':'<small>Saving is unavailable in this browser, so progress won\u2019t persist.</small>')}
function showOv(w){document.getElementById('ov').style.display=w?'flex':'none';
document.getElementById('title').style.display=w==='title'?'block':'none';
document.getElementById('pause').style.display=w==='pause'?'block':'none';
if(w==='title')renderSlots();if(w==='pause')document.getElementById('p-info').textContent='';paused=!!w}
function startGame(n,d){slot=n;const base={coins:0,gel:0,pelt:0,fang:0,apple:0,kills:0,sword:0,armor:0};
if(d){setSeed(d.seed);P.x=d.x;P.y=d.y;P.hp=d.hp;inv=Object.assign(base,d.inv);playT=d.t||0}

function los(ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay),n=Math.ceil(d*2);for(let i=1;i<n;i++){const k=i/n;if(SOLID.has(tileAt(Math.floor(ax+(bx-ax)*k),Math.floor(ay+(by-ay)*k))))return false}return true}

if(P.hp<=0){sfx('die');const lost=Math.floor(inv.coins*.25);inv.coins-=lost;spawn();save();say('You were knocked out'+(lost?' and dropped '+lost+' coins':'')+'. You wake up in town.')}}

function updateEnemies(dt){
P.inv=Math.max(0,P.inv-dt);P.cd=Math.max(0,P.cd-dt);P.sw=Math.max(0,P.sw-dt);
const inTown=townTile(Math.floor(P.x),Math.floor(P.y))>=0;
if(inTown){P.regen=(P.regen||0)+dt;if(P.regen>2){P.regen=0;P.hp=Math.min(maxHp(),P.hp+1)}}else P.regen=0;
spT-=dt;
if(spT<=0){spT=1.5;if(enemies.length<10){const a=Math.random()*6.283,r=14+Math.random()*7,x=P.x+Math.cos(a)*r,y=P.y+Math.sin(a)*r,tx=Math.floor(x),ty=Math.floor(y),t=tileAt(tx,ty);
if(townTile(tx,ty)<0&&!SOLID.has(t)&&t>1&&t!==8&&t!==9){const z=zoneAt(tx,ty),tier=dangerAt(tx,ty),k=(((z==='Forest'||z==='Mountains')&&Math.random()<.7)||(tier>=2&&Math.random()<.5))?'wolf':'slime';enemies.push({k:k,tier:tier,mhp:Math.ceil(ET[k].hp*(1+.6*tier)),hp:Math.ceil(ET[k].hp*(1+.6*tier)),x:x,y:y,st:0,lost:0,lt:0,cd:0,fl:0,wx:0,wy:0,wt:0})}}}
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i],T=ET[e.k],dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy);
if(d>32){enemies.splice(i,1);continue}
e.fl-=dt;e.cd-=dt;e.lt-=dt;
if(d<T.sight&&e.lt<=0){e.lt=.25;if(!inTown&&los(e.x,e.y,P.x,P.y)){if(!e.st)sfx('spot');e.st=1;e.lost=0}}
if(e.st===1){e.lost+=dt;if(inTown||d>T.sight*1.8||e.lost>4)e.st=0}
let mx=0,my=0,sp=T.sp*(1+.04*e.tier);
if(e.st===1){if(d>.7){mx=dx/d;my=dy/d}}
else{e.wt-=dt;if(e.wt<=0){e.wt=1+Math.random()*2;const a=Math.random()*6.283,m=Math.random()<.4?0:1;e.wx=Math.cos(a)*m;e.wy=Math.sin(a)*m}mx=e.wx;my=e.wy;sp*=.4}
const nx=e.x+mx*sp*dt;if(!eBlocked(nx,e.y))e.x=nx;
const ny=e.y+my*sp*dt;if(!eBlocked(e.x,ny))e.y=ny;
if(e.st===1&&d<.85&&e.cd<=0){e.cd=1;hurtPlayer(T.dmg+Math.floor(e.tier/2),e.x,e.y)}}}
function drawEnemies(camX,camY){for(const e of enemies){const T=ET[e.k],sx=e.x*TS-camX,sy=e.y*TS-camY,sc=1+.12*e.tier;if(sx<-30||sy<-30||sx>W+30||sy>H+30)continue;

function forestZ(x,y){return fbm(x/90+900,y/90+900,seed+11,3)}
function tileAt(x,y){
const tt=townTile(x,y);if(tt>=0)return tt;
const e=fbm(x/40,y/40,seed,4), m=fbm(x/28+500,y/28+500,seed+7,3);
if(roadAt(x,y))return e<.44?9:8;
if(e<.38)return 0; if(e<.44)return 1; if(e<.48)return 2;
if(e<.62){const r=hash(x,y,seed+3);
if(forestZ(x,y)>.55)return r<.4?4:14;
if(r>.985)return 7; return (m>.52&&r<.2)?4:3}
if(e<.70)return 5; return e>.77?13:6}
function zoneAt(x,y){if(townTile(x,y)>=0){const b=bAt(x,y);return b?'Inside: '+b.name:'Town'}const t=tileAt(x,y);
if(t===8||t===9)return 'Road';if(t===5||t===6||t===13)return 'Mountains';if(t<=1)return 'Water';if(t===2)return 'Beach';
if(t===14||(t===4&&forestZ(x,y)>.55))return 'Forest';return 'Plains'}

const chunks=new Map(); // "cx,cy" -> offscreen canvas
function buildChunk(cx,cy){
const cv=document.createElement('canvas');cv.width=cv.height=CH*TS;const g=cv.getContext('2d');
for(let j=0;j<CH;j++)for(let i=0;i<CH;i++){
const wx=cx*CH+i,wy=cy*CH+j,t=tileAt(wx,wy);
const X=i*TS,Y=j*TS;
let bc=COL[t];if(t>=18&&t<=25){const bb=bAt(wx,wy);bc=bb&&TFLOOR.has(bb.kind)?'#d8d8e0':'#c9a36b'}
g.fillStyle=bc;g.fillRect(X,Y,TS,TS);
if(t>=15&&t<=26)drawBld(g,t,X,Y);
else if(t===4){g.fillStyle='#1d5a2b';g.beginPath();g.arc(X+TS/2,Y+TS/2,TS*.38,0,7);g.fill()}
else if(t===7){g.fillStyle='#e8b923';g.fillRect(X+6,Y+8,12,9)}
else if(t===11){g.fillStyle='rgba(0,0,0,.18)';g.fillRect(X,Y+TS-3,TS,3)}
else if(t===12){g.fillStyle='#5a3a1e';g.fillRect(X+6,Y+4,12,TS-4)}
else if(t===9){g.fillStyle='rgba(0,0,0,.25)';g.fillRect(X,Y+TS/2,TS,2)}
else if(t===13||t===6){g.fillStyle='rgba(0,0,0,.08)';g.fillRect(X+TS/2,Y,TS/2,TS)}
else if(hash(wx,wy,seed+9)<.15){g.fillStyle='rgba(0,0,0,.06)';g.fillRect(X,Y,TS,TS)}}
return cv}

ctx.drawImage(cv,sx,sy);
if(gridEl.checked){ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1;ctx.strokeRect(sx+.5,sy+.5,CH*TS,CH*TS)}}
if(mouse.down&&!paused){const r=cvs.getBoundingClientRect();attack(mouse.x-r.left-W/2,mouse.y-r.top-H/2)}
updateEnemies(dt);updateDrops(dt);drawDrops(camX,camY);drawEnemies(camX,camY);
ctx.fillStyle=(P.inv>0&&Math.floor(now/80)%2)?'#fff':'#d7263d';ctx.strokeStyle='#fff';ctx.lineWidth=2;
ctx.beginPath();ctx.arc(W/2,H/2,.3*TS,0,7);ctx.fill();ctx.stroke();

if(ptr){const r0=cvs.getBoundingClientRect(),cx=ptr.clientX-r0.left,cy=ptr.clientY-r0.top;let vx=cx-ptr0.x,vy=cy-ptr0.y;const l0=Math.hypot(vx,vy),m=Math.min(l0,40);if(l0>0){vx=vx/l0*m;vy=vy/l0*m}
ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.55)';ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.arc(ptr0.x,ptr0.y,44,0,7);ctx.fill();ctx.stroke();
ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(ptr0.x+vx,ptr0.y+vy,18,0,7);ctx.fill()}
if(P.sw>0){ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=4;const ang=P.sa;ctx.beginPath();ctx.arc(W/2,H/2,1.1*TS,ang-1.05,ang+1.05);ctx.stroke()}
if(aim&&Math.hypot(aim.dx,aim.dy)>14){const a=Math.atan2(aim.dy,aim.dx);ctx.strokeStyle='rgba(255,90,90,.85)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W/2+Math.cos(a)*.5*TS,H/2+Math.sin(a)*.5*TS);ctx.lineTo(W/2+Math.cos(a)*1.7*TS,H/2+Math.sin(a)*1.7*TS);ctx.stroke()}
const ins=bAt(Math.floor(P.x),Math.floor(P.y));
for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const t=townOf(pcx+i,pcy+j);if(!t)continue;
for(const b of t.b){b.a+=((b===ins?0:1)-b.a)*Math.min(1,dt*10);
const sx=Math.round(b.x0*TS-camX),sy=Math.round(b.y0*TS-camY),w=b.w*TS,h=(b.h-1)*TS;
if(b.a<.02||sx>W||sy>H||sx+w<0||sy+h<0)continue;
ctx.globalAlpha=b.a;ctx.fillStyle=b.roof;ctx.fillRect(sx,sy,w,h);
ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(sx,sy+h-4,w,4);ctx.strokeStyle='rgba(0,0,0,.4)';ctx.strokeRect(sx+.5,sy+.5,w-1,h-1);
ctx.fillStyle='#fff';ctx.font='bold 12px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(b.name,sx+w/2,sy+h/2+4)}}
ctx.globalAlpha=1;
promptEl.style.display=nearby()?'block':'none';
hud.textContent='seed   '+seed+'\npos    '+P.x.toFixed(1)+', '+P.y.toFixed(1)+'\nzone   '+zoneAt(Math.floor(P.x),Math.floor(P.y))+'\nchunk  '+pcx+', '+pcy+'\nloaded '+chunks.size+' chunks ('+chunks.size*CH*CH+' tiles)';
hud.textContent+='\nhp     '+'\u2665'.repeat(Math.max(0,P.hp))+'\u2661'.repeat(Math.max(0,maxHp()-Math.max(0,P.hp)))+'  coins '+inv.coins+'  kills '+inv.kills+'\ndanger '+dangerAt(P.x,P.y)+'  sword '+(inv.sword||0)+'  armor '+(inv.armor||0);
requestAnimationFrame(frame)}
